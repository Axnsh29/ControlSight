name: ControlSight CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

jobs:

  qa:

    name: ControlSight QA

    runs-on: ubuntu-latest

    timeout-minutes: 15


    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"


      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"


      - name: Upgrade pip
        run: |
          python -m pip install --upgrade pip


      - name: Install runtime dependencies
        run: |

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install \
              fastapi \
              "uvicorn[standard]" \
              pandas \
              numpy \
              pydantic \
              python-multipart \
              reportlab \
              openpyxl
          fi


      - name: Install QA dependencies
        run: |
          pip install -r requirements-dev.txt


      - name: Compile Python
        run: |
          python -m compileall -q \
            src/backend \
            tests \
            scripts


      - name: Validate frontend JavaScript
        run: |

          for file in \
            src/frontend/js/dashboard.js \
            src/frontend/js/polish.js \
            src/frontend/js/upload.js \
            src/frontend/js/attention-ui.js \
            src/frontend/js/change-control-ui.js \
            src/frontend/js/risk-cashflow-ui.js \
            src/frontend/js/report-pack-ui.js \
            src/frontend/js/app-shell.js \
            src/frontend/js/ui-polish.js

          do

            if [ -f "$file" ]; then

              echo "Checking $file"

              node --check "$file"

            else

              echo "Missing frontend module: $file"

              exit 1

            fi

          done


      - name: Run critical Ruff checks
        run: |
          ruff check \
            --config .ruff.toml \
            src \
            tests


      - name: Build analytical database
        run: |
          python src/backend/build_database.py


      - name: Run API regression tests
        run: |
          pytest -q


      - name: Show database output
        if: always()
        run: |
          ls -lh data/database || true


      - name: Show report-pack output
        if: always()
        run: |
          ls -lh data/report_packs || true

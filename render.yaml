services:
  - type: web
    name: controlsight
    runtime: python
    plan: free
    region: frankfurt

    buildCommand: >
      pip install -r requirements.txt &&
      python src/backend/build_database.py
      --output data/database/controlsight.db

    startCommand: >
      uvicorn src.backend.main:app
      --host 0.0.0.0
      --port $PORT

    autoDeployTrigger: commit

target-version = "py311"
line-length = 100

exclude = [
    "*.ipynb",
    ".git",
    ".github",
    ".pytest_cache",
    ".ruff_cache",
    "__pycache__",
    "data",
]

[lint]

# Only serious correctness errors for the current ControlSight release.
# We are deliberately NOT enforcing full style/formatting yet.
select = [
    "E9",
    "F63",
    "F7",
    "F82",
]
